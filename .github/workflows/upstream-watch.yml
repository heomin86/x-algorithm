name: Upstream watch (x-algorithm)

on:
  schedule:
    - cron: '17 * * * *'   # 매시 17분 (UTC 기준, 한국 시간도 매시 17분)
  workflow_dispatch:
    inputs:
      test_notion:
        description: '노션 연결 테스트 페이지 만들기'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  sync-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Notion connection test
        if: inputs.test_notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python3 -I - <<'PY'
          import json, os, urllib.request, datetime
          db = os.environ.get('NOTION_DATABASE_ID') or '42178036ac8381c9b96bdba058a3d5ee'
          body = {"parent": {"database_id": db}, "properties": {
              "커밋": {"title": [{"text": {"content": "연결 테스트 (GitHub Actions)"}}]},
              "날짜": {"date": {"start": datetime.datetime.now(datetime.timezone.utc).isoformat()}},
              "상태": {"select": {"name": "확인함"}}}}
          req = urllib.request.Request('https://api.notion.com/v1/pages', data=json.dumps(body).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['NOTION_TOKEN'],
                       'Notion-Version': '2022-06-28', 'Content-Type': 'application/json'}, method='POST')
          try:
              print('OK', json.load(urllib.request.urlopen(req)).get('url'))
          except urllib.error.HTTPError as e:
              print('Notion error', e.code, e.read().decode()); raise SystemExit(1)
          PY

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/xai-org/x-algorithm.git
          git fetch upstream main

      - name: Find new upstream commits
        id: check
        run: |
          OLD=$(git merge-base HEAD upstream/main)
          NEW=$(git rev-parse upstream/main)
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$OLD" = "$NEW" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Build diff report
        if: steps.check.outputs.changed == 'true'
        run: python3 -I .github/scripts/diff_report.py . ${{ steps.check.outputs.old }} ${{ steps.check.outputs.new }} > report.md

      - name: Post to Notion
        if: steps.check.outputs.changed == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python3 -I .github/scripts/notify_notion.py . ${{ steps.check.outputs.old }} ${{ steps.check.outputs.new }} report.md

      - name: Sync fork with upstream
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/main
          git push origin HEAD:main
